<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Habbo Retro Engine - Catalogo Completo & Stanza Isometrica</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: "Volter Goldfish", "Ubuntu", Tahoma, sans-serif;
      font-size: 11px;
    }
    body {
      background: #1e262c;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* TOP BAR STATS */
    #topbar {
      height: 38px;
      background: #2b3339;
      border-bottom: 2px solid #101518;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
    }
    .wallet-box {
      display: flex;
      gap: 15px;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1b2024;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #3d474e;
      font-weight: bold;
    }
    .coin-gold { color: #f5b041; }
    .diamond { color: #5dade2; }

    /* VIEWPORT STANZA */
    #game-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #2e3943 0%, #171d22 100%);
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }

    /* TOOLBAR INFERIORE */
    #bottom-bar {
      height: 48px;
      background: #242b31;
      border-top: 2px solid #14181b;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
      z-index: 10;
    }
    .btn {
      background: #41515d;
      border: 2px solid #5a6e7e;
      border-bottom-color: #28323a;
      border-right-color: #28323a;
      color: #fff;
      padding: 6px 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: #4e606e; }
    .btn:active {
      border-color: #28323a #5a6e7e #5a6e7e #28323a;
    }

    /* INVENTARIO DOCK */
    #inventory-dock {
      flex: 1;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px;
      background: #1b2024;
      border: 1px solid #343f47;
      border-radius: 4px;
      height: 38px;
      align-items: center;
    }
    .inv-item {
      min-width: 32px;
      height: 32px;
      background: #2d373f;
      border: 1px solid #4a5966;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .inv-item.selected {
      border-color: #f1c40f;
      box-shadow: 0 0 5px #f1c40f;
    }
    .inv-item-count {
      position: absolute;
      bottom: 1px;
      right: 2px;
      font-size: 9px;
      color: #ddd;
    }

    /* FINESTRA CATALOGO */
    .habbo-window {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 580px;
      height: 440px;
      background: #e2e2e2;
      color: #222;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      border: 2px solid #ffffff;
      z-index: 100;
    }
    .habbo-header {
      background: #1c5274;
      color: #fff;
      padding: 6px 10px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 4px 4px 0 0;
      cursor: move;
    }
    .habbo-close {
      background: #d9534f;
      color: #fff;
      border: 1px solid #fff;
      padding: 0 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .catalog-body {
      flex: 1;
      display: flex;
      padding: 8px;
      gap: 8px;
      overflow: hidden;
    }
    .catalog-tabs {
      width: 140px;
      background: #ced5d9;
      border: 1px solid #a4b0b7;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px;
      overflow-y: auto;
    }
    .cat-tab {
      padding: 6px 8px;
      background: #b5c1c7;
      border: 1px solid #94a3ab;
      cursor: pointer;
      font-weight: bold;
      border-radius: 3px;
    }
    .cat-tab.active {
      background: #fff;
      border-color: #1c5274;
      color: #1c5274;
    }
    .catalog-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #a4b0b7;
      padding: 8px;
    }
    .catalog-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      grid-auto-rows: 68px;
      gap: 6px;
      overflow-y: auto;
      padding: 4px;
      background: #f7f9fa;
      border: 1px solid #d5dcde;
    }
    .cat-card {
      border: 1px solid #c9d2d6;
      background: #fff;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      position: relative;
    }
    .cat-card:hover {
      background: #eef5f9;
      border-color: #1c5274;
    }
    .cat-card.selected {
      border: 2px solid #f39c12;
      background: #fef9e7;
    }
    .catalog-preview {
      height: 95px;
      border-top: 1px solid #d5dcde;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
    }
    .preview-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .preview-title {
      font-weight: bold;
      font-size: 13px;
      color: #1c5274;
    }
    .preview-cost {
      font-weight: bold;
      color: #d35400;
    }
    .rotate-hint {
      position: absolute;
      bottom: 60px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <script>
    /* =========================================================================

    const FURNI_DATABASE = [
      // CAMBIO VALUTE & RARI

      { id: "chair_plasto_1", name: "Sedia Plasto Blu", cat: "plasto", credits: 3, diamonds: 0, w: 1, h: 1, type: "seat", color: "#2980b9", shape: "plasto_chair" },

      { id: "classic1_sofa", name: "Sofà Executive", cat: "plasto", credits: 8, diamonds: 0, w: 2, h: 1, type: "seat", color: "#34495e", shape: "sofa" },

      // BUILDERS CLUB (BLOCCHI)
      { id: "bc_block_wool", name: "Blocco di Lana", cat: "bc", credits: 2, diamonds: 0, w: 1, h: 1, type: "block", color: "#ecf0f1", shape: "cube" },
      { id: "bc_block_redbrick", name: "Mattoni Rossi", cat: "bc", credits: 2, diamonds: 0, w: 1, h: 1, type: "block", color: "#922b21", shape: "cube" },
      { id: "bc_block_marble", name: "Colonna di Marmo", cat: "bc", credits: 3, diamonds: 0, w: 1, h: 1, type: "block", color: "#bdc3c7", shape: "pillar" },
      { id: "bc_block_glass", name: "Vetro Trasparente", cat: "bc", credits: 2, diamonds: 0, w: 1, h: 1, type: "block", color: "#aed6f1", shape: "glass" },
      { id: "bc_cone_10", name: "Cono Stradale", cat: "bc", credits: 2, diamonds: 0, w: 1, h: 1, type: "deco", color: "#e67e22", shape: "cone" },

      // ARCADE
      { id: "arcade_c23_cyberpunk", name: "Cabinato Cyberpunk", cat: "arcade", credits: 15, diamonds: 2, w: 1, h: 1, type: "arcade", color: "#8e44ad", shape: "arcade_cab" },
      { id: "arcade_c23_pinball", name: "Flipper Galattico", cat: "arcade", credits: 14, diamonds: 2, w: 1, h: 2, type: "arcade", color: "#e74c3c", shape: "pinball" },
      { id: "arcade_c23_vrmachine", name: "Postazione VR", cat: "arcade", credits: 20, diamonds: 5, w: 2, h: 2, type: "arcade", color: "#16a085", shape: "vr" },

      // BAZAAR & ARABIAN
      { id: "bazaar_c17_pillow", name: "Cuscino del Sultano", cat: "bazaar", credits: 4, diamonds: 0, w: 1, h: 1, type: "seat", color: "#8e44ad", shape: "cushion" },
      { id: "bazaar_c17_rug", name: "Tappeto Volante", cat: "bazaar", credits: 8, diamonds: 1, w: 2, h: 2, type: "rug", color: "#b7950b", shape: "rug" },
      { id: "bazaar_c17_vase", name: "Vaso con Spezie", cat: "bazaar", credits: 5, diamonds: 0, w: 1, h: 1, type: "deco", color: "#d35400", shape: "vase" },

      // SPONSOR & PROMO RETRO
      { id: "ads_calip_cola_1", name: "Distributore Calippo", cat: "retro", credits: 12, diamonds: 0, w: 1, h: 1, type: "vending", color: "#27ae60", shape: "vending" },
      { id: "ads_fanta_vendingmachine", name: "Distributore Fanta", cat: "retro", credits: 12, diamonds: 0, w: 1, h: 1, type: "vending", color: "#e67e22", shape: "vending" },
      { id: "ads_bigtv_missmix", name: "Maxischermo MTV", cat: "retro", credits: 18, diamonds: 3, w: 2, h: 1, type: "tv", color: "#111", shape: "tv" },

      // CIRCO
      { id: "circus_c24_clowncar", name: "Auto del Clown", cat: "circus", credits: 15, diamonds: 2, w: 2, h: 2, type: "car", color: "#e74c3c", shape: "clowncar" },
      { id: "circus_c24_spotlight", name: "Riflettore da Palco", cat: "circus", credits: 9, diamonds: 0, w: 1, h: 1, type: "light", color: "#f39c12", shape: "spot" },

      // ABBIGLIAMENTO & LOOK
      { id: "clothing_80safro", name: "Capelli Afro '80", cat: "clothing", credits: 10, diamonds: 5, type: "wear", part: "hair", color: "#2c3e50" },
      { id: "clothing_aviatorjacket", name: "Giacca Aviazione", cat: "clothing", credits: 12, diamonds: 8, type: "wear", part: "torso", color: "#784212" },
      { id: "clothing_badtzbackpack", name: "Zainetto Pipistrello", cat: "clothing", credits: 8, diamonds: 2, type: "wear", part: "backpack", color: "#111" }
    ];

    const CATEGORIES = [
      { id: "currency", name: "Rari & Valute" },
      { id: "plasto", name: "Arredo Classico" },
      { id: "bc", name: "Costruzioni BC" },
      { id: "arcade", name: "Arcade Games" },
      { id: "bazaar", name: "Bazaar & Arabian" },
      { id: "retro", name: "Sponsor & Retro" },
      { id: "circus", name: "Circo & Spettacolo" },
      { id: "clothing", name: "Sartoria & Look" }
    ];

    /* =========================================================================
       2. STATO DEL GIOCO
       ========================================================================= */
    const state = {
      credits: 5000,
      diamonds: 250,
      activeTab: "currency",
      selectedCatalogItem: null,
      inventory: [],
      selectedInvIndex: -1,
      rotation: 0, // 0, 1, 2, 3
      gridSize: 10,
      tileWidth: 64,
      tileHeight: 32,
      placedFurni: [],
      avatar: { x: 4, y: 4, direction: 2, hairColor: "#4a235a", torsoColor: "#2980b9" },
      mouseTile: { x: -1, y: -1 }
    };

    /* =========================================================================
       3. ENGINE ISOMETRICO & CANVAS
       ========================================================================= */
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Coordinate Isometriche
    function toIso(x, y) {
      const originX = canvas.width / 2;
      const originY = canvas.height / 2 - (state.gridSize * state.tileHeight) / 3;
      return {
        screenX: originX + (x - y) * (state.tileWidth / 2),
        screenY: originY + (x + y) * (state.tileHeight / 2)
      };
    }

    function fromIso(screenX, screenY) {
      const originX = canvas.width / 2;
      const originY = canvas.height / 2 - (state.gridSize * state.tileHeight) / 3;
      const dx = screenX - originX;
      const dy = screenY - originY;
      const x = Math.floor((dy / (state.tileHeight / 2) + dx / (state.tileWidth / 2)) / 2);
      const y = Math.floor((dy / (state.tileHeight / 2) - dx / (state.tileWidth / 2)) / 2);
      return { x, y };
    }

    // Rendering Griglia Tile
    function drawFloorTile(gx, gy, highlight = false) {
      const { screenX, screenY } = toIso(gx, gy);
      const hw = state.tileWidth / 2;
      const hh = state.tileHeight / 2;

      ctx.beginPath();
      ctx.moveTo(screenX, screenY);
      ctx.lineTo(screenX + hw, screenY + hh);
      ctx.lineTo(screenX, screenY + state.tileHeight);
      ctx.lineTo(screenX - hw, screenY + hh);
      ctx.closePath();

      ctx.fillStyle = highlight ? "#7fb3d5" : ((gx + gy) % 2 === 0 ? "#95a5a6" : "#7f8c8d");
      ctx.fill();
      ctx.strokeStyle = "#566573";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Disegno Pixel Art Procedurale dei Furni
    function drawFurni(furni, screenX, screenY, rot = 0) {
      ctx.save();
      ctx.translate(screenX, screenY + state.tileHeight / 2);

      const c = furni.color || "#e67e22";
      const outline = "#1b2024";

      switch (furni.shape) {
        case "throne":
          // Trono classico con cuscino e braccioli dorati
          ctx.fillStyle = outline;
          ctx.fillRect(-16, -42, 32, 42);
          ctx.fillStyle = "#f1c40f";
          ctx.fillRect(-14, -40, 28, 40);
          ctx.fillStyle = "#c0392b";
          ctx.fillRect(-10, -32, 20, 30);
          ctx.fillStyle = "#f39c12";
          ctx.fillRect(-14, -14, 28, 6);
          break;

        case "coin":
        case "key":
          ctx.fillStyle = outline;
          ctx.beginPath();
          ctx.arc(0, -10, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = c;
          ctx.beginPath();
          ctx.arc(0, -10, 8, 0, Math.PI * 2);
          ctx.fill();
          break;

        case "bar":
        case "bigbar":
          ctx.fillStyle = outline;
          ctx.fillRect(-14, -12, 28, 12);
          ctx.fillStyle = c;
          ctx.fillRect(-12, -10, 24, 8);
          ctx.fillStyle = "#fef9e7";
          ctx.fillRect(-10, -9, 8, 2);
          break;

        case "plasto_chair":
          // Sedia plasto classica con gambe in ferro
          ctx.strokeStyle = "#7f8c8d";
          ctx.lineWidth = 2;
          ctx.strokeRect(-8, -12, 16, 12);
          ctx.fillStyle = outline;
          ctx.fillRect(-12, -26, 24, 16);
          ctx.fillStyle = c;
          ctx.fillRect(-10, -24, 20, 12);
          ctx.fillRect(-10, -12, 20, 4);
          break;

        case "arcade_cab":
          // Cabina Arcade anni '90
          ctx.fillStyle = outline;
          ctx.fillRect(-14, -44, 28, 44);
          ctx.fillStyle = c;
          ctx.fillRect(-12, -42, 24, 40);
          ctx.fillStyle = "#00ffff";
          ctx.fillRect(-8, -32, 16, 14);
          ctx.fillStyle = "#e74c3c";
          ctx.fillRect(-6, -14, 4, 4);
          break;

        case "vending":
          // Distributore automatico
          ctx.fillStyle = outline;
          ctx.fillRect(-16, -38, 32, 38);
          ctx.fillStyle = c;
          ctx.fillRect(-14, -36, 28, 34);
          ctx.fillStyle = "#2c3e50";
          ctx.fillRect(-10, -30, 20, 14);
          ctx.fillStyle = "#ecf0f1";
          ctx.fillRect(-8, -10, 16, 4);
          break;

        case "table":
          ctx.fillStyle = outline;
          ctx.fillRect(-22, -22, 44, 16);
          ctx.fillStyle = c;
          ctx.fillRect(-20, -20, 40, 12);
          ctx.fillStyle = "#3e2723";
          ctx.fillRect(-18, -8, 4, 12);
          ctx.fillRect(14, -8, 4, 12);
          break;

        case "cube":
        case "pillar":
        case "glass":
          const h = furni.shape === "pillar" ? 36 : 20;
          ctx.fillStyle = outline;
          ctx.fillRect(-16, -h - 4, 32, h + 4);
          ctx.fillStyle = c;
          ctx.fillRect(-14, -h - 2, 28, h);
          break;

        default:
          // Rendering standard poligonale per arredi generici
          ctx.fillStyle = outline;
          ctx.fillRect(-12, -24, 24, 24);
          ctx.fillStyle = c;
          ctx.fillRect(-10, -22, 20, 20);
          break;
      }
      ctx.restore();
    }

    // Rendering Avatar
    function drawAvatar(x, y) {
      const { screenX, screenY } = toIso(x, y);
      const px = screenX;
      const py = screenY + 8;

      ctx.save();
      // Ombra sotto i piedi
      ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
      ctx.beginPath();
      ctx.ellipse(px, py, 14, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // Gambe
      ctx.fillStyle = "#2c3e50";
      ctx.fillRect(px - 5, py - 18, 4, 12);
      ctx.fillRect(px + 1, py - 18, 4, 12);

      // Busto / Maglia
      ctx.fillStyle = state.avatar.torsoColor;
      ctx.fillRect(px - 7, py - 32, 14, 15);

      // Testa / Viso
      ctx.fillStyle = "#f5cba7";
      ctx.fillRect(px - 6, py - 44, 12, 12);

      // Occhi
      ctx.fillStyle = "#000";
      ctx.fillRect(px - 2, py - 39, 2, 3);
      ctx.fillRect(px + 3, py - 39, 2, 3);

      // Capelli
      ctx.fillStyle = state.avatar.hairColor;
      ctx.fillRect(px - 7, py - 48, 14, 6);
      ctx.fillRect(px - 7, py - 44, 3, 8);

      ctx.restore();
    }

    // Ciclo Principale di Render
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Pavimento
      for (let x = 0; x < state.gridSize; x++) {
        for (let y = 0; y < state.gridSize; y++) {
          const isHover = (state.mouseTile.x === x && state.mouseTile.y === y);
          drawFloorTile(x, y, isHover);
        }
      }

      // 2. Ordinamento di profondità isometrico (Painter's algorithm: x + y)
      const renderQueue = [];

      state.placedFurni.forEach(f => {
        renderQueue.push({ type: "furni", x: f.x, y: f.y, depth: f.x + f.y, data: f });
      });

      renderQueue.push({
        type: "avatar",
        x: state.avatar.x,
        y: state.avatar.y,
        depth: state.avatar.x + state.avatar.y
      });

      renderQueue.sort((a, b) => a.depth - b.depth);

      // 3. Esecuzione disegno elementi ordinati
      renderQueue.forEach(item => {
        if (item.type === "furni") {
          const { screenX, screenY } = toIso(item.x, item.y);
          drawFurni(item.data.meta, screenX, screenY, item.data.rot);
        } else if (item.type === "avatar") {
          drawAvatar(item.x, item.y);
        }
      });

      // 4. Anteprima posizionamento dall'inventario
      if (state.selectedInvIndex >= 0 && state.mouseTile.x >= 0 && state.mouseTile.x < state.gridSize && state.mouseTile.y >= 0 && state.mouseTile.y < state.gridSize) {
        const item = state.inventory[state.selectedInvIndex];
        if (item && item.type !== "wear") {
          const { screenX, screenY } = toIso(state.mouseTile.x, state.mouseTile.y);
          ctx.globalAlpha = 0.5;
          drawFurni(item, screenX, screenY, state.rotation);
          ctx.globalAlpha = 1.0;
        }
      }

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    /* =========================================================================
       4. INTERAZIONE E GESTIONE EVENTI CANVAS
       ========================================================================= */
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const coords = fromIso(e.clientX - rect.left, e.clientY - rect.top);
      state.mouseTile = coords;
    });

    canvas.addEventListener("click", () => {
      const { x, y } = state.mouseTile;
      if (x < 0 || x >= state.gridSize || y < 0 || y >= state.gridSize) return;

      // Se abbiamo un elemento selezionato nell'inventario, lo posiamo
      if (state.selectedInvIndex >= 0) {
        const item = state.inventory[state.selectedInvIndex];
        if (!item) return;

        // Se è un capo d'abbigliamento, lo indossiamo invece di posarlo
        if (item.type === "wear") {
          if (item.part === "hair") state.avatar.hairColor = item.color;
          if (item.part === "torso") state.avatar.torsoColor = item.color;
          return;
        }

        // Posizionamento Furni
        state.placedFurni.push({
          x: x,
          y: y,
          rot: state.rotation,
          meta: item
        });

        // Rimuovi 1 pezzo dall'inventario
        item.count--;
        if (item.count <= 0) {
          state.inventory.splice(state.selectedInvIndex, 1);
          state.selectedInvIndex = -1;
        }
        renderInventoryUI();
      } else {
        // Altrimenti muovi l'avatar sulla tile cliccata
        state.avatar.x = x;
        state.avatar.y = y;
      }
    });

    // Tasto destro: rimuovi furni e rimettilo nell'inventario
    canvas.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      const { x, y } = state.mouseTile;
      const idx = state.placedFurni.findIndex(f => f.x === x && f.y === y);
      if (idx !== -1) {
        const removed = state.placedFurni.splice(idx, 1)[0];
        addToInventory(removed.meta);
      }
    });

    // Rotazione con tasto 'R'
    window.addEventListener("keydown", (e) => {
      if (e.key === "r" || e.key === "R") {
        state.rotation = (state.rotation + 1) % 4;
      }
    });

    /* =========================================================================
       5. LOGICA CATALOGO & INVENTARIO
       ========================================================================= */
    const catWindow = document.getElementById("catalog-window");
    const openCatBtn = document.getElementById("btn-open-catalog");
    const closeCatBtn = document.getElementById("btn-close-catalog");
    const tabsContainer = document.getElementById("category-tabs");
    const gridContainer = document.getElementById("catalog-items-grid");
    const buyBtn = document.getElementById("btn-buy-item");

    openCatBtn.addEventListener("click", () => {
      catWindow.style.display = "flex";
      renderCatalogTabs();
      renderCatalogGrid();
    });

    closeCatBtn.addEventListener("click", () => {
      catWindow.style.display = "none";
    });

    function renderCatalogTabs() {
      tabsContainer.innerHTML = "";
      CATEGORIES.forEach(cat => {
        const div = document.createElement("div");
        div.className = `cat-tab ${state.activeTab === cat.id ? "active" : ""}`;
        div.innerText = cat.name;
        div.onclick = () => {
          state.activeTab = cat.id;
          state.selectedCatalogItem = null;
          renderCatalogTabs();
          renderCatalogGrid();
          updatePreview();
        };
        tabsContainer.appendChild(div);
      });
    }

    function renderCatalogGrid() {
      gridContainer.innerHTML = "";
      const filtered = FURNI_DATABASE.filter(f => f.cat === state.activeTab);

      filtered.forEach(f => {
        const card = document.createElement("div");
        card.className = `cat-card ${state.selectedCatalogItem && state.selectedCatalogItem.id === f.id ? "selected" : ""}`;
        
        // Mini icona generata
        const miniCanvas = document.createElement("canvas");
        miniCanvas.width = 38;
        miniCanvas.height = 38;
        const mctx = miniCanvas.getContext("2d");
        mctx.fillStyle = f.color || "#888";
        mctx.fillRect(8, 8, 22, 22);
        mctx.strokeStyle = "#111";
        mctx.lineWidth = 1;
        mctx.strokeRect(8, 8, 22, 22);

        const label = document.createElement("span");
        label.style.fontSize = "9px";
        label.style.marginTop = "4px";
        label.style.textAlign = "center";
        label.innerText = f.name.length > 10 ? f.name.substring(0, 9) + "..." : f.name;

        card.appendChild(miniCanvas);
        card.appendChild(label);

        card.onclick = () => {
          state.selectedCatalogItem = f;
          renderCatalogGrid();
          updatePreview();
        };

        gridContainer.appendChild(card);
      });
    }

    function updatePreview() {
      const item = state.selectedCatalogItem;
      if (!item) {
        document.getElementById("prev-name").innerText = "Seleziona un articolo";
        document.getElementById("prev-desc").innerText = "Scegli un oggetto da posare o indossare.";
        document.getElementById("prev-price").innerText = "";
        return;
      }
      document.getElementById("prev-name").innerText = item.name;
      document.getElementById("prev-desc").innerText = `ID: ${item.id} | Dimensione: ${item.w || 1}x${item.h || 1}`;
      document.getElementById("prev-price").innerText = `${item.credits} Crediti ${item.diamonds > 0 ? "+ " + item.diamonds + " Diamanti" : ""}`;
    }

    // Acquisto
    buyBtn.addEventListener("click", () => {
      const item = state.selectedCatalogItem;
      if (!item) return;

      if (state.credits < item.credits || state.diamonds < item.diamonds) {
        alert("Non hai abbastanza fondi per completare l'acquisto!");
        return;
      }

      state.credits -= item.credits;
      state.diamonds -= item.diamonds;
      document.getElementById("val-credits").innerText = state.credits;
      document.getElementById("val-diamonds").innerText = state.diamonds;

      addToInventory(item);
    });

    function addToInventory(furniMeta) {
      const exist = state.inventory.find(i => i.id === furniMeta.id);
      if (exist) {
        exist.count++;
      } else {
        state.inventory.push({ ...furniMeta, count: 1 });
      }
      renderInventoryUI();
    }

    function renderInventoryUI() {
      const dock = document.getElementById("inventory-dock");
      dock.innerHTML = "";

      state.inventory.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = `inv-item ${state.selectedInvIndex === index ? "selected" : ""}`;
        div.title = item.name;

        // Piccolo indicatore di colore
        const dot = document.createElement("div");
        dot.style.width = "16px";
        dot.style.height = "16px";
        dot.style.backgroundColor = item.color || "#e67e22";
        dot.style.border = "1px solid #111";

        const countBadge = document.createElement("span");
        countBadge.className = "inv-item-count";
        countBadge.innerText = item.count;

        div.appendChild(dot);
        div.appendChild(countBadge);

        div.onclick = () => {
          state.selectedInvIndex = (state.selectedInvIndex === index) ? -1 : index;
          renderInventoryUI();
        };

        dock.appendChild(div);
      });
    }

    /* DRAG FINESTRA CATALOGO */
    const dragHeader = document.getElementById("cat-drag");
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    dragHeader.addEventListener("mousedown", (e) => {
      isDragging = true;
      dragOffset.x = e.clientX - catWindow.offsetLeft;
      dragOffset.y = e.clientY - catWindow.offsetTop;
    });

    window.addEventListener("mousemove", (e) => {
      if (isDragging) {
        catWindow.style.left = `${e.clientX - dragOffset.x}px`;
        catWindow.style.top = `${e.clientY - dragOffset.y}px`;
      }
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portale Blog & Canale Multimediale</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #f59e0b;
      --danger: #ef4444;
      --admin-badge: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 4rem;
    }

    /* BARRA SUPERIORE */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-info {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .role-badge {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-left: 4px;
    }
    .role-admin { background: var(--admin-badge); color: #fff; }
    .role-reader { background: var(--border); color: #cbd5e1; }

    .btn {
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 0.55rem 1.2rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }

    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    /* CONTENITORE CENTRALE */
    .container {
      max-width: 820px;
      margin: 2.5rem auto;
      padding: 0 1.25rem;
    }

    /* MODALE AUTENTICAZIONE */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: bold;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input, textarea, select {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
    }

    /* PANNELLO DI PUBBLICAZIONE (SOLO ADMIN) */
    #admin-panel {
      background: #192231;
      border: 2px dashed var(--admin-badge);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2.5rem;
      display: none;
    }

    /* FEED E SCHEDE POST */
    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .post-header {
      padding: 1.25rem 1.5rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .post-title {
      font-size: 1.35rem;
      color: #fff;
    }

    .post-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .media-box {
      width: 100%;
      background: #000;
    }

    .media-box img {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      display: block;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .post-body {
      padding: 1.25rem 1.5rem;
      color: #cbd5e1;
      white-space: pre-wrap;
    }

    /* COMMENTI E INTERAZIONI */
    .post-footer {
      background: #141d29;
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }

    .comments-section {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .comment-item {
      background: #1a2433;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .comment-author {
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">CANALE & BLOG PERSONALE</div>
    <div class="user-controls">
      <div id="auth-info" class="user-info">Non sei collegato</div>
      <button class="btn" id="open-auth-btn">Accedi / Registrati</button>
      <button class="btn btn-secondary" id="logout-btn" style="display: none;">Esci</button>
    </div>
  </header>

  <div class="container">

    <!-- PANNELLO ESCLUSIVO ADMIN (VISIBILE SOLO CON LOGIN ADMIN) -->
    <section id="admin-panel">
      <h2 style="color: var(--admin-badge); margin-bottom: 1rem;">👑 Crea Contenuto (Pannello Autore)</h2>
      <form id="publishForm">
        <div class="form-group">
          <label>Formato Contenuto</label>
          <select id="postType">
            <option value="article">Articolo di Testo</option>
            <option value="photo">Foto / Immagine</option>
            <option value="video">Video YouTube</option>
          </select>
        </div>

        <div class="form-group">
          <label>Titolo del Contenuto</label>
          <input type="text" id="postTitle" required placeholder="Inserisci il titolo...">
        </div>

        <div class="form-group" id="mediaUrlBox" style="display: none;">
          <label id="mediaLabel">Collegamento Media</label>
          <input type="text" id="postMedia" placeholder="Incolla l'URL...">
        </div>

        <div class="form-group">
          <label>Testo / Descrizione</label>
          <textarea id="postText" rows="5" required placeholder="Scrivi il corpo del testo o la descrizione..."></textarea>
        </div>

        <button type="submit" class="btn" style="background: var(--admin-badge); color: #fff;">Pubblica sul Canale</button>
      </form>
    </section>

    <!-- FEED ARTICOLI -->
    <h3 style="margin-bottom: 1.5rem; color: var(--text-muted);">Ultime Pubblicazioni</h3>
    <div id="postsFeed"></div>

  </div>

  <!-- MODALE REGISTRAZIONE E LOGIN -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <div class="tab-bar">
        <button class="tab-btn active" id="tabLoginBtn">Accedi</button>
        <button class="tab-btn" id="tabRegisterBtn">Registrati</button>
      </div>

      <!-- FORM LOGIN -->
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required placeholder="mario@esempio.it">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Entra</button>
      </form>

      <!-- FORM REGISTRAZIONE -->
      <form id="registerForm" style="display: none;">
        <div class="form-group">
          <label>Nome Visibile / Nickname</label>
          <input type="text" id="regName" required placeholder="Es. Marco">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required placeholder="tuamail@esempio.it">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" required placeholder="Almeno 6 caratteri">
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Crea Account</button>
      </form>

      <div style="text-align: center; margin-top: 1.25rem;">
        <button id="closeModalBtn" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">Annulla</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       1. DATABASE E MEMORIZZAZIONE LOCALE (PERSISTENTE)
       ========================================================================= */
    const STORAGE_USERS = "hub_users_db";
    const STORAGE_SESSION = "hub_active_user";
    const STORAGE_POSTS = "hub_posts_db";

    // Inizializza l'account Admin nel database se non esiste
    function initUsers() {
      let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "[]");
      const adminExists = users.some(u => u.email === "admin@blog.it");
      if (!adminExists) {
        users.push({
          name: "Amministratore",
          email: "admin@blog.it",
          password: "admin123",
          role: "admin"
        });
        localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
      }
    }
    initUsers();

    function getSession() {
      return JSON.parse(localStorage.getItem(STORAGE_SESSION) || "null");
    }

    function setSession(user) {
      localStorage.setItem(STORAGE_SESSION, JSON.stringify(user));
      updateAuthUI();
    }

    function clearSession() {
      localStorage.removeItem(STORAGE_SESSION);
      updateAuthUI();
    }

    /* =========================================================================
       2. GESTIONE AUTENTICAZIONE E MODALE
       ========================================================================= */
    const authModal = document.getElementById("authModal");
    const openAuthBtn = document.getElementById("open-auth-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const authInfo = document.getElementById("auth-info");
    const adminPanel = document.getElementById("admin-panel");

    const tabLoginBtn = document.getElementById("tabLoginBtn");
    const tabRegisterBtn = document.getElementById("tabRegisterBtn");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    openAuthBtn.onclick = () => { authModal.style.display = "flex"; };
    document.getElementById("closeModalBtn").onclick = () => { authModal.style.display = "none"; };

    tabLoginBtn.onclick = () => {
      tabLoginBtn.classList.add("active");
      tabRegisterBtn.classList.remove("active");
      loginForm.style.display = "block";
      registerForm.style.display = "none";
    };

    tabRegisterBtn.onclick = () => {
      tabRegisterBtn.classList.add("active");
      tabLoginBtn.classList.remove("active");
      loginForm.style.display = "none";
      registerForm.style.display = "block";
    };

    // Registrazione nuovo utente (Lettore)
    registerForm.onsubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim().toLowerCase();
      const password = document.getElementById("regPassword").value;

      let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "[]");
      if (users.some(u => u.email === email)) {
        alert("Questa email è già registrata!");
        return;
      }

      const newUser = { name, email, password, role: "reader" };
      users.push(newUser);
      localStorage.setItem(STORAGE_USERS, JSON.stringify(users));

      alert("Registrazione completata con successo! Ora sei connesso.");
      setSession(newUser);
      authModal.style.display = "none";
      registerForm.reset();
    };

    // Login Utente
    loginForm.onsubmit = (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value;

      let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "[]");
      const found = users.find(u => u.email === email && u.password === password);

      if (!found) {
        alert("Credenziali errate!");
        return;
      }

      setSession(found);
      authModal.style.display = "none";
      loginForm.reset();
    };

    logoutBtn.onclick = () => {
      clearSession();
    };

    function updateAuthUI() {
      const user = getSession();
      if (user) {
        authInfo.innerHTML = `Ciao, <b>${user.name}</b> <span class="role-badge ${user.role === 'admin' ? 'role-admin' : 'role-reader'}">${user.role}</span>`;
        openAuthBtn.style.display = "none";
        logoutBtn.style.display = "inline-flex";

        // Solo l'amministratore vede e usa il pannello di scrittura
        if (user.role === "admin") {
          adminPanel.style.display = "block";
        } else {
          adminPanel.style.display = "none";
        }
      } else {
        authInfo.innerText = "Non sei collegato";
        openAuthBtn.style.display = "inline-flex";
        logoutBtn.style.display = "none";
        adminPanel.style.display = "none";
      }
      renderPosts();
    }

    /* =========================================================================
       3. GESTIONE PUBBLICAZIONE (SOLO ADMIN)
       ========================================================================= */
    const postTypeSelect = document.getElementById("postType");
    const mediaUrlBox = document.getElementById("mediaUrlBox");
    const mediaLabel = document.getElementById("mediaLabel");

    postTypeSelect.onchange = (e) => {
      const val = e.target.value;
      if (val === "article") {
        mediaUrlBox.style.display = "none";
      } else if (val === "photo") {
        mediaUrlBox.style.display = "block";
        mediaLabel.innerText = "URL Immagine (JPG, PNG, WebP)";
      } else if (val === "video") {
        mediaUrlBox.style.display = "block";
        mediaLabel.innerText = "Link Video YouTube (es. https://www.youtube.com/watch?v=...)";
      }
    };

    function getYouTubeEmbed(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : null;
    }

    document.getElementById("publishForm").onsubmit = (e) => {
      e.preventDefault();
      const user = getSession();
      if (!user || user.role !== "admin") {
        alert("Azione non consentita: solo l'amministratore può pubblicare!");
        return;
      }

      const newPost = {
        id: Date.now().toString(),
        type: postTypeSelect.value,
        title: document.getElementById("postTitle").value.trim(),
        media: document.getElementById("postMedia").value.trim(),
        text: document.getElementById("postText").value.trim(),
        date: new Date().toLocaleDateString("it-IT"),
        comments: []
      };

      let posts = JSON.parse(localStorage.getItem(STORAGE_POSTS) || "[]");
      posts.unshift(newPost);
      localStorage.setItem(STORAGE_POSTS, JSON.stringify(posts));

      e.target.reset();
      mediaUrlBox.style.display = "none";
      renderPosts();
    };

    /* =========================================================================
       4. RENDERING DEL FEED & COMMENTI DEI LETTORI
       ========================================================================= */
    function renderPosts() {
      const feed = document.getElementById("postsFeed");
      const posts = JSON.parse(localStorage.getItem(STORAGE_POSTS) || "[]");
      const user = getSession();
      feed.innerHTML = "";

      if (posts.length === 0) {
        feed.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:2rem;">Nessun articolo ancora pubblicato. L'amministratore può pubblicare dal modulo qui sopra!</div>`;
        return;
      }

      posts.forEach(post => {
        const card = document.createElement("article");
        card.className = "post-card";

        // Elaborazione Media
        let mediaHtml = "";
        if (post.type === "photo" && post.media) {
          mediaHtml = `<div class="media-box"><img src="${post.media}" onerror="this.style.display='none'"></div>`;
        } else if (post.type === "video" && post.media) {
          const ytUrl = getYouTubeEmbed(post.media);
          if (ytUrl) {
            mediaHtml = `<div class="media-box video-container"><iframe src="${ytUrl}" allowfullscreen></iframe></div>`;
          }
        }

        // Sezione elimina riservata all'admin
        const deleteButton = (user && user.role === "admin") 
          ? `<button class="btn btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deletePost('${post.id}')">Elimina</button>` 
          : "";

        // Lista Commenti
        const commentsList = post.comments.map(c => `
          <div class="comment-item">
            <div class="comment-author">${c.author}</div>
            <div>${c.text}</div>
          </div>
        `).join("");

        // Modulo commenti per gli utenti autenticati
        const commentForm = user 
          ? `<div style="display:flex; gap:8px; margin-top:8px;">
               <input type="text" id="comm-input-${post.id}" placeholder="Scrivi un commento come ${user.name}..." style="font-size:0.85rem; padding:6px 10px;">
               <button class="btn" style="font-size:0.85rem; padding:6px 12px;" onclick="addComment('${post.id}')">Invia</button>
             </div>`
          : `<div style="font-size:0.85rem; color:var(--text-muted); margin-top:8px;">Effettua l'accesso per poter commentare questo articolo.</div>`;

        card.innerHTML = `
          <div class="post-header">
            <div>
              <h2 class="post-title">${post.title}</h2>
              <div class="post-meta">Pubblicato il ${post.date} da <b>Amministratore</b></div>
            </div>
            ${deleteButton}
          </div>
          ${mediaHtml}
          <div class="post-body">${post.text}</div>
          <div class="post-footer">
            <h4 style="font-size:0.85rem; color:var(--text-muted); margin-bottom:6px;">Commenti (${post.comments.length})</h4>
            <div class="comments-section">${commentsList}</div>
            ${commentForm}
          </div>
        `;

        feed.appendChild(card);
      });
    }

    // Aggiunta Commento (Aperto a qualsiasi utente registrato/loggato)
    window.addComment = function(postId) {
      const user = getSession();
      if (!user) return;

      const input = document.getElementById(`comm-input-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      let posts = JSON.parse(localStorage.getItem(STORAGE_POSTS) || "[]");
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.comments.push({ author: user.name, text });
        localStorage.setItem(STORAGE_POSTS, JSON.stringify(posts));
        renderPosts();
      }
    };

    // Eliminazione Post (Solo Admin)
    window.deletePost = function(postId) {
      const user = getSession();
      if (!user || user.role !== "admin") return;

      if (confirm("Vuoi davvero rimuovere questo contenuto dal canale?")) {
        let posts = JSON.parse(localStorage.getItem(STORAGE_POSTS) || "[]");
        posts = posts.filter(p => p.id !== postId);
        localStorage.setItem(STORAGE_POSTS, JSON.stringify(posts));
        renderPosts();
      }
    };

    // Avvio e ripristino sessione
    updateAuthUI();
  </script>
</body>
</html>

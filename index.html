<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Habbo Hotel - Stanza & Catalogo Originale</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Ubuntu', Tahoma, Verdana, sans-serif;
      font-size: 11px;
    }

    body {
      background: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #room-viewport {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }

    /* BARRA INFERIORE HABBO */
    #bottom-bar {
      height: 52px;
      background: linear-gradient(180deg, #444f56 0%, #293237 50%, #1c2327 100%);
      border-top: 2px solid #5a676f;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 10;
    }

    .habbo-btn {
      background: linear-gradient(180deg, #008cd2 0%, #005f93 100%);
      border: 1px solid #73d2ff;
      border-bottom: 2px solid #003653;
      border-right: 2px solid #003653;
      border-radius: 4px;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      padding: 7px 16px;
      cursor: pointer;
      text-shadow: 1px 1px 2px #000;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .habbo-btn:hover {
      background: linear-gradient(180deg, #1aa4ed 0%, #0074b4 100%);
    }

    /* WALLET */
    #purse {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 5;
    }
    .purse-badge {
      background: rgba(28, 35, 39, 0.92);
      border: 1px solid #48565f;
      border-radius: 4px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 125px;
      font-weight: bold;
    }

    /* INVENTARIO SLOTS */
    #inventory-tray {
      flex: 1;
      height: 42px;
      background: #14181a;
      border: 1px solid #3d474e;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 6px;
      gap: 6px;
      overflow-x: auto;
    }
    .inv-slot {
      width: 38px;
      height: 38px;
      background: #252e33;
      border: 1px solid #48565f;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .inv-slot:hover { border-color: #f1c40f; }
    .inv-slot.selected {
      border: 2px solid #f1c40f;
      background: #39464e;
    }
    .inv-slot img {
      max-width: 32px;
      max-height: 32px;
      image-rendering: pixelated;
    }
    .inv-count {
      position: absolute;
      bottom: 1px;
      right: 2px;
      font-size: 9px;
      color: #f1c40f;
      font-weight: bold;
      text-shadow: 1px 1px 1px #000;
    }

    /* CATALOGO */
    #catalog-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 630px;
      height: 490px;
      background: #e9ecef;
      border-radius: 6px;
      border: 2px solid #ffffff;
      box-shadow: 0 12px 40px rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      z-index: 100;
      color: #333;
    }
    .modal-header {
      height: 34px;
      background: linear-gradient(180deg, #1c5576 0%, #11364d 100%);
      color: #fff;
      font-weight: bold;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 4px 4px 0 0;
      border-bottom: 2px solid #0b2230;
      cursor: move;
    }
    .close-btn {
      width: 20px;
      height: 20px;
      background: #c0392b;
      color: #fff;
      border: 1px solid #fff;
      border-radius: 3px;
      font-weight: bold;
      line-height: 18px;
      text-align: center;
      cursor: pointer;
    }
    .catalog-main {
      flex: 1;
      display: flex;
      padding: 10px;
      gap: 10px;
      overflow: hidden;
    }
    .catalog-menu {
      width: 165px;
      background: #c5ced4;
      border: 1px solid #9eabb3;
      border-radius: 4px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
    }
    .menu-item {
      padding: 8px 10px;
      background: #b1bcc3;
      border: 1px solid #8e9ca4;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      color: #24333c;
    }
    .menu-item.active {
      background: #fff;
      color: #11364d;
      border-color: #11364d;
    }
    .catalog-page {
      flex: 1;
      background: #fff;
      border: 1px solid #9eabb3;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }
    .catalog-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      grid-auto-rows: 70px;
      gap: 8px;
      overflow-y: auto;
      background: #f4f6f7;
      border: 1px solid #d0d7db;
      padding: 8px;
      border-radius: 3px;
    }
    .furni-slot {
      background: #fff;
      border: 1px solid #c2cbcf;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      position: relative;
    }
    .furni-slot:hover { border-color: #008cd2; background: #f0f7fb; }
    .furni-slot.selected {
      border: 2px solid #e67e22;
      background: #fef5e7;
    }
    .furni-slot img {
      max-width: 46px;
      max-height: 46px;
      image-rendering: pixelated;
    }
    .furni-preview-bar {
      height: 95px;
      border-top: 1px solid #d0d7db;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }
    .preview-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .preview-img-box {
      width: 52px;
      height: 52px;
      background: #f7f9fa;
      border: 1px solid #c8d3d8;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-img-box img {
      max-width: 48px;
      max-height: 48px;
      image-rendering: pixelated;
    }
    .price-tag {
      font-size: 13px;
      font-weight: bold;
      color: #d35400;
    }
  </style>
</head>
<body>

  <div id="purse">
    <div class="purse-badge">
      <span style="color:#f1c40f;">🪙 Crediti:</span>
      <span id="cr-count">3000</span>
    </div>
    <div class="purse-badge">
      <span style="color:#5dade2;">💎 Diamanti:</span>
      <span id="dia-count">250</span>
    </div>
  </div>

  <div id="room-viewport">
    <canvas id="habbo-canvas"></canvas>
  </div>

  <div id="bottom-bar">
    <button class="habbo-btn" id="open-cat-btn">🛒 Catalogo Negozio</button>
    <div style="font-weight:bold; color:#a2b1bb; margin-left:6px;">Inventario:</div>
    <div id="inventory-tray"></div>
    <div style="font-size:10px; color:#8496a3;"><b>Click</b> per posare/muovere • <b>Tasto destro</b> sul furni per ritirarlo</div>
  </div>

  <!-- MODALE CATALOGO -->
  <div id="catalog-modal">
    <div class="modal-header" id="modal-drag">
      <span>Catalogo Ufficiale Arredi</span>
      <div class="close-btn" id="close-cat-btn">✕</div>
    </div>
    <div class="catalog-main">
      <div class="catalog-menu" id="cat-tabs-container"></div>
      <div class="catalog-page">
        <div class="catalog-grid" id="cat-items-container"></div>
        <div class="furni-preview-bar">
          <div class="preview-left">
            <div class="preview-img-box">
              <img id="prev-icon" src="" style="display:none;" />
            </div>
            <div>
              <div id="prev-title" style="font-weight:bold; font-size:13px; color:#1c5576;">Seleziona un articolo</div>
              <div id="prev-desc" style="color:#666;">Scegli un furni dal catalogo per visualizzarne il prezzo</div>
              <div id="prev-cost" class="price-tag" style="margin-top:2px;"></div>
            </div>
          </div>
          <button class="habbo-btn" id="btn-buy" style="background:linear-gradient(180deg, #27ae60 0%, #196f3d 100%); border-color:#58d68d; font-size:13px; padding:8px 24px;">Compra</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       1. CDN REPOSITORY UFFICIALE (PATH CORRETTO: icons/)
       ========================================================================= */
    const CDN_BASE = "https://cdn.jsdelivr.net/gh/higoka/habbo-furniture-icon/icons/";

    const FURNI_ITEMS = [
      // 1. RARI & VALUTE
      { id: "CFC_500_goldbar", name: "Lingotto 500cr", cat: "currency", credits: 500, diamonds: 0, icon: "CFC_500_goldbar_icon.png" },
      { id: "LT_throne", name: "Trono Habbo Classico", cat: "currency", credits: 250, diamonds: 50, icon: "LT_throne_icon.png" },
      { id: "CF_10_coin_gold", name: "Moneta d'Oro (10cr)", cat: "currency", credits: 10, diamonds: 0, icon: "CF_10_coin_gold_icon.png" },
      { id: "CF_20_moneybag", name: "Sacco di Denaro", cat: "currency", credits: 20, diamonds: 0, icon: "CF_20_moneybag_icon.png" },
      { id: "CF_200_ruby", name: "Rubino Prezioso", cat: "currency", credits: 200, diamonds: 10, icon: "CF_200_ruby_icon.png" },
      { id: "CF_240_sapphire", name: "Zaffiro Reale", cat: "currency", credits: 240, diamonds: 15, icon: "CF_240_sapphire_icon.png" },
      { id: "CF_1000_goldenkey", name: "Chiave d'Oro", cat: "currency", credits: 1000, diamonds: 75, icon: "CF_1000_goldenkey_icon.png" },

      // 2. PLASTO CLASSICO
      { id: "chair_plasto_1", name: "Sedia Plasto Blu", cat: "plasto", credits: 3, diamonds: 0, icon: "chair_plasto_1_icon.png" },
      { id: "chair_plasto_2", name: "Sedia Plasto Verde", cat: "plasto", credits: 3, diamonds: 0, icon: "chair_plasto_2_icon.png" },
      { id: "chair_plasto_3", name: "Sedia Plasto Gialla", cat: "plasto", credits: 3, diamonds: 0, icon: "chair_plasto_3_icon.png" },
      { id: "chair_plasto_4", name: "Sedia Plasto Rossa", cat: "plasto", credits: 3, diamonds: 0, icon: "chair_plasto_4_icon.png" },
      { id: "chair_plasto_8", name: "Sedia Plasto Nera", cat: "plasto", credits: 3, diamonds: 0, icon: "chair_plasto_8_icon.png" },
      { id: "chair_plasto_10", name: "Sedia Plasto Bianca", cat: "plasto", credits: 3, diamonds: 0, icon: "chair_plasto_10_icon.png" },

      // 3. SPONSOR & RETRÒ
      { id: "ads_calip_cola_1", name: "Distributore Calippo", cat: "retro", credits: 15, diamonds: 0, icon: "ads_calip_cola_1_icon.png" },
      { id: "ads_fanta_vendingmachine", name: "Distributore Fanta", cat: "retro", credits: 15, diamonds: 0, icon: "ads_fanta_vendingmachine_icon.png" },
      { id: "ads_bigtv_missmix", name: "Maxischermo MTV", cat: "retro", credits: 25, diamonds: 5, icon: "ads_bigtv_missmix_icon.png" },
      { id: "ads_capri_arcade", name: "Arcade Capri-Sun", cat: "retro", credits: 18, diamonds: 2, icon: "ads_capri_arcade_icon.png" },

      // 4. ARCADE & GAMING
      { id: "arcade_c23_cyberpunk", name: "Cabina Cyberpunk", cat: "arcade", credits: 20, diamonds: 3, icon: "arcade_c23_cyberpunk_icon.png" },
      { id: "arcade_c23_pinball", name: "Flipper Galattico", cat: "arcade", credits: 18, diamonds: 2, icon: "arcade_c23_pinball_icon.png" },
      { id: "arcade_c23_vrmachine", name: "Postazione VR", cat: "arcade", credits: 25, diamonds: 5, icon: "arcade_c23_vrmachine_icon.png" },

      // 5. BAZAAR & ARABIAN
      { id: "bazaar_c17_pillow", name: "Cuscino Orientale", cat: "bazaar", credits: 4, diamonds: 0, icon: "bazaar_c17_pillow_icon.png" },
      { id: "bazaar_c17_rug", name: "Tappeto Arabo", cat: "bazaar", credits: 8, diamonds: 1, icon: "bazaar_c17_rug_icon.png" },
      { id: "bazaar_c17_vase", name: "Vaso con Spezie", cat: "bazaar", credits: 5, diamonds: 0, icon: "bazaar_c17_vase_icon.png" },
      { id: "bazaar_c17_lamp", name: "Lanterna del Sultano", cat: "bazaar", credits: 6, diamonds: 0, icon: "bazaar_c17_lamp_icon.png" },

      // 6. BUILDERS CLUB
      { id: "bc_block_wool_1", name: "Blocco Lana Bianca", cat: "bc", credits: 2, diamonds: 0, icon: "bc_block_wool_1_icon.png" },
      { id: "bc_block_redbrick_1", name: "Mattoni Rossi", cat: "bc", credits: 2, diamonds: 0, icon: "bc_block_redbrick_1_icon.png" },
      { id: "bc_cone_10", name: "Cono Stradale", cat: "bc", credits: 2, diamonds: 0, icon: "bc_cone_10_icon.png" },
      { id: "bc_block_grass_1", name: "Blocco Erba Viva", cat: "bc", credits: 2, diamonds: 0, icon: "bc_block_grass_1_icon.png" }
    ];

    const CATEGORIES = [
      { id: "currency", name: "Rari & Valute" },
      { id: "plasto", name: "Plasto Classico" },
      { id: "retro", name: "Sponsor Retrò" },
      { id: "arcade", name: "Arcade Games" },
      { id: "bazaar", name: "Bazaar & Arabian" },
      { id: "bc", name: "Builders Club" }
    ];

    /* =========================================================================
       2. GESTIONE CARICAMENTO IMMAGINI CON FALLBACK AUTOMATICO
       ========================================================================= */
    const imageCache = {};

    function getFurniImage(iconName) {
      if (!imageCache[iconName]) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = CDN_BASE + iconName;
        img.onerror = () => {
          // Fallback secondario se jsDelivr ha un timeout
          img.src = "https://raw.githubusercontent.com/higoka/habbo-furniture-icon/master/icons/" + iconName;
        };
        imageCache[iconName] = img;
      }
      return imageCache[iconName];
    }

    // Precaricamento
    FURNI_ITEMS.forEach(f => getFurniImage(f.icon));

    /* =========================================================================
       3. ENGINE ISOMETRICO
       ========================================================================= */
    const canvas = document.getElementById("habbo-canvas");
    const ctx = canvas.getContext("2d");

    const state = {
      credits: 3000,
      diamonds: 250,
      gridSize: 9,
      tileW: 64,
      tileH: 32,
      activeCategory: "currency",
      selectedCatalog: null,
      inventory: [
        { ...FURNI_ITEMS[0], count: 2 },
        { ...FURNI_ITEMS[1], count: 1 }
      ],
      selectedInvIdx: -1,
      placedFurni: [
        { x: 3, y: 3, item: FURNI_ITEMS[1] },
        { x: 4, y: 3, item: FURNI_ITEMS[0] }
      ],
      avatar: { x: 4, y: 5 },
      mouseTile: { x: -1, y: -1 }
    };

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function toIso(x, y) {
      const ox = canvas.width / 2;
      const oy = canvas.height / 2 - (state.gridSize * state.tileH) / 3.2;
      return {
        sx: ox + (x - y) * (state.tileW / 2),
        sy: oy + (x + y) * (state.tileH / 2)
      };
    }

    function fromIso(sx, sy) {
      const ox = canvas.width / 2;
      const oy = canvas.height / 2 - (state.gridSize * state.tileH) / 3.2;
      const dx = sx - ox;
      const dy = sy - oy;
      return {
        x: Math.floor((dy / (state.tileH / 2) + dx / (state.tileW / 2)) / 2),
        y: Math.floor((dy / (state.tileH / 2) - dx / (state.tileW / 2)) / 2)
      };
    }

    function drawRoomTile(x, y, isHover) {
      const { sx, sy } = toIso(x, y);
      const hw = state.tileW / 2;
      const hh = state.tileH / 2;

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + hw, sy + hh);
      ctx.lineTo(sx, sy + state.tileH);
      ctx.lineTo(sx - hw, sy + hh);
      ctx.closePath();

      ctx.fillStyle = isHover ? "#ffffff" : ((x + y) % 2 === 0 ? "#98aab4" : "#8c9ea8");
      ctx.fill();
      ctx.strokeStyle = isHover ? "#00c0ff" : "#72838c";
      ctx.lineWidth = 1;
      ctx.stroke();

      if (isHover) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    function drawWalls() {
      for (let y = 0; y < state.gridSize; y++) {
        const { sx, sy } = toIso(0, y);
        ctx.fillStyle = "#55646d";
        ctx.beginPath();
        ctx.moveTo(sx - state.tileW/2, sy + state.tileH/2);
        ctx.lineTo(sx, sy);
        ctx.lineTo(sx, sy - 85);
        ctx.lineTo(sx - state.tileW/2, sy + state.tileH/2 - 85);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#38434a";
        ctx.stroke();
      }

      for (let x = 0; x < state.gridSize; x++) {
        const { sx, sy } = toIso(x, 0);
        ctx.fillStyle = "#697a85";
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + state.tileW/2, sy + state.tileH/2);
        ctx.lineTo(sx + state.tileW/2, sy + state.tileH/2 - 85);
        ctx.lineTo(sx, sy - 85);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#38434a";
        ctx.stroke();
      }
    }

    function drawAvatar(x, y) {
      const { sx, sy } = toIso(x, y);
      const px = sx;
      const py = sy + 6;

      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath();
      ctx.ellipse(px, py, 14, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // Pantaloni & Scarpe
      ctx.fillStyle = "#111";
      ctx.fillRect(px - 5, py - 4, 4, 3);
      ctx.fillRect(px + 2, py - 4, 4, 3);
      ctx.fillStyle = "#1b4f72";
      ctx.fillRect(px - 5, py - 18, 4, 14);
      ctx.fillRect(px + 1, py - 18, 4, 14);

      // Maglia
      ctx.fillStyle = "#111";
      ctx.fillRect(px - 7, py - 32, 14, 15);
      ctx.fillStyle = "#f39c12";
      ctx.fillRect(px - 6, py - 31, 12, 13);

      // Viso
      ctx.fillStyle = "#f5cba7";
      ctx.fillRect(px - 5, py - 43, 10, 11);
      ctx.fillStyle = "#000";
      ctx.fillRect(px - 2, py - 38, 2, 2);
      ctx.fillRect(px + 2, py - 38, 2, 2);

      // Capelli
      ctx.fillStyle = "#4a235a";
      ctx.fillRect(px - 6, py - 47, 12, 5);
      ctx.fillRect(px - 7, py - 44, 3, 7);
      ctx.restore();
    }

    function drawFurniSprite(item, sx, sy, alpha = 1.0) {
      const img = getFurniImage(item.icon);
      if (img.complete && img.naturalWidth !== 0) {
        ctx.save();
        ctx.globalAlpha = alpha;
        // Ingrandimento pixel art 1.6x calibrato sulla griglia isometrica
        const scale = 1.6;
        const iw = img.naturalWidth * scale;
        const ih = img.naturalHeight * scale;
        ctx.drawImage(img, sx - iw / 2, sy + state.tileH / 2 - ih + 4, iw, ih);
        ctx.restore();
      }
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawWalls();

      for (let x = 0; x < state.gridSize; x++) {
        for (let y = 0; y < state.gridSize; y++) {
          const isH = (state.mouseTile.x === x && state.mouseTile.y === y);
          drawRoomTile(x, y, isH);
        }
      }

      const renderList = [];

      state.placedFurni.forEach(f => {
        renderList.push({ type: "furni", x: f.x, y: f.y, depth: f.x + f.y, data: f });
      });

      renderList.push({
        type: "avatar",
        x: state.avatar.x,
        y: state.avatar.y,
        depth: state.avatar.x + state.avatar.y
      });

      renderList.sort((a, b) => a.depth - b.depth);

      renderList.forEach(obj => {
        if (obj.type === "furni") {
          const { sx, sy } = toIso(obj.x, obj.y);
          drawFurniSprite(obj.data.item, sx, sy);
        } else if (obj.type === "avatar") {
          drawAvatar(obj.x, obj.y);
        }
      });

      // Preview posizionamento
      if (state.selectedInvIdx >= 0 && state.mouseTile.x >= 0 && state.mouseTile.x < state.gridSize && state.mouseTile.y >= 0 && state.mouseTile.y < state.gridSize) {
        const item = state.inventory[state.selectedInvIdx];
        if (item) {
          const { sx, sy } = toIso(state.mouseTile.x, state.mouseTile.y);
          drawFurniSprite(item, sx, sy, 0.55);
        }
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    /* =========================================================================
       4. INTERAZIONE STANZA
       ========================================================================= */
    canvas.addEventListener("mousemove", (e) => {
      const r = canvas.getBoundingClientRect();
      state.mouseTile = fromIso(e.clientX - r.left, e.clientY - r.top);
    });

    canvas.addEventListener("click", () => {
      const { x, y } = state.mouseTile;
      if (x < 0 || x >= state.gridSize || y < 0 || y >= state.gridSize) return;

      if (state.selectedInvIdx >= 0) {
        const item = state.inventory[state.selectedInvIdx];
        state.placedFurni.push({
          x: x,
          y: y,
          item: item
        });

        item.count--;
        if (item.count <= 0) {
          state.inventory.splice(state.selectedInvIdx, 1);
          state.selectedInvIdx = -1;
        }
        updateInventoryUI();
      } else {
        state.avatar.x = x;
        state.avatar.y = y;
      }
    });

    canvas.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      const { x, y } = state.mouseTile;
      const idx = state.placedFurni.findIndex(f => f.x === x && f.y === y);
      if (idx !== -1) {
        const removed = state.placedFurni.splice(idx, 1)[0];
        const exist = state.inventory.find(i => i.id === removed.item.id);
        if (exist) {
          exist.count++;
        } else {
          state.inventory.push({ ...removed.item, count: 1 });
        }
        updateInventoryUI();
      }
    });

    /* =========================================================================
       5. CATALOGO CON ICONE REALI
       ========================================================================= */
    const catModal = document.getElementById("catalog-modal");
    const openBtn = document.getElementById("open-cat-btn");
    const closeBtn = document.getElementById("close-cat-btn");
    const tabsCont = document.getElementById("cat-tabs-container");
    const itemsCont = document.getElementById("cat-items-container");
    const buyBtn = document.getElementById("btn-buy");

    openBtn.onclick = () => {
      catModal.style.display = "flex";
      buildTabs();
      buildItems();
    };

    closeBtn.onclick = () => {
      catModal.style.display = "none";
    };

    function buildTabs() {
      tabsCont.innerHTML = "";
      CATEGORIES.forEach(c => {
        const div = document.createElement("div");
        div.className = `menu-item ${state.activeCategory === c.id ? "active" : ""}`;
        div.innerText = c.name;
        div.onclick = () => {
          state.activeCategory = c.id;
          state.selectedCatalog = null;
          buildTabs();
          buildItems();
          updatePreview();
        };
        tabsCont.appendChild(div);
      });
    }

    function buildItems() {
      itemsCont.innerHTML = "";
      const filtered = FURNI_ITEMS.filter(f => f.cat === state.activeCategory);

      filtered.forEach(item => {
        const slot = document.createElement("div");
        slot.className = `furni-slot ${state.selectedCatalog && state.selectedCatalog.id === item.id ? "selected" : ""}`;

        const img = document.createElement("img");
        img.src = CDN_BASE + item.icon;
        img.alt = item.name;
        img.onerror = () => {
          img.src = "https://raw.githubusercontent.com/higoka/habbo-furniture-icon/master/icons/" + item.icon;
        };

        slot.appendChild(img);

        slot.onclick = () => {
          state.selectedCatalog = item;
          buildItems();
          updatePreview();
        };

        itemsCont.appendChild(slot);
      });
    }

    function updatePreview() {
      const it = state.selectedCatalog;
      const prevIcon = document.getElementById("prev-icon");

      if (!it) {
        document.getElementById("prev-title").innerText = "Seleziona un articolo";
        document.getElementById("prev-desc").innerText = "Scegli un furni dal catalogo per visualizzarne il prezzo";
        document.getElementById("prev-cost").innerText = "";
        prevIcon.style.display = "none";
        return;
      }

      prevIcon.src = CDN_BASE + it.icon;
      prevIcon.style.display = "block";
      document.getElementById("prev-title").innerText = it.name;
      document.getElementById("prev-desc").innerText = `Asset Ufficiale: ${it.icon}`;
      document.getElementById("prev-cost").innerText = `${it.credits} Crediti ${it.diamonds > 0 ? "+ " + it.diamonds + " Diamanti" : ""}`;
    }

    buyBtn.onclick = () => {
      const it = state.selectedCatalog;
      if (!it) return;

      if (state.credits < it.credits || state.diamonds < it.diamonds) {
        alert("Crediti insufficienti!");
        return;
      }

      state.credits -= it.credits;
      state.diamonds -= it.diamonds;
      document.getElementById("cr-count").innerText = state.credits;
      document.getElementById("dia-count").innerText = state.diamonds;

      const exist = state.inventory.find(i => i.id === it.id);
      if (exist) {
        exist.count++;
      } else {
        state.inventory.push({ ...it, count: 1 });
      }
      updateInventoryUI();
    };

    function updateInventoryUI() {
      const tray = document.getElementById("inventory-tray");
      tray.innerHTML = "";

      state.inventory.forEach((item, idx) => {
        const slot = document.createElement("div");
        slot.className = `inv-slot ${state.selectedInvIdx === idx ? "selected" : ""}`;

        const img = document.createElement("img");
        img.src = CDN_BASE + item.icon;
        img.onerror = () => {
          img.src = "https://raw.githubusercontent.com/higoka/habbo-furniture-icon/master/icons/" + item.icon;
        };

        const count = document.createElement("span");
        count.className = "inv-count";
        count.innerText = item.count;

        slot.appendChild(img);
        slot.appendChild(count);

        slot.onclick = () => {
          state.selectedInvIdx = (state.selectedInvIdx === idx) ? -1 : idx;
          updateInventoryUI();
        };

        tray.appendChild(slot);
      });
    }

    updateInventoryUI();
  </script>
</body>
</html>
